<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پنل مدیریت سکه‌چی</title><style>body{font-family:Tahoma,sans-serif;max-width:1000px;margin:2rem auto;padding:0 1rem;background:#faf8f3;color:#30291f}button,input{padding:.65rem;margin:.25rem;border:1px solid #d5c7af;border-radius:6px}button{background:#b7791f;color:#fff;cursor:pointer}.panel{background:#fff;padding:1rem;margin:1rem 0;border:1px solid #eadfcd;border-radius:8px}.row{display:flex;gap:.5rem;align-items:center;justify-content:space-between;border-bottom:1px solid #eee;padding:.6rem 0}</style></head>
<body><h1>پنل مدیریت سکه‌چی</h1><section class="panel"><h2>ورود مدیر</h2><input id="email" type="email" placeholder="ایمیل"><input id="password" type="password" placeholder="رمز عبور"><button id="login">ورود</button><p id="message"></p></section><main id="dashboard" hidden><section class="panel"><h2>محصولات</h2><input id="productName" placeholder="نام محصول"><input id="productPrice" type="number" placeholder="قیمت"><button id="addProduct">افزودن</button><div id="products"></div></section><section class="panel"><h2>دسته‌بندی‌ها</h2><input id="categoryName" placeholder="نام دسته‌بندی"><button id="addCategory">افزودن</button><div id="categories"></div></section><section class="panel"><h2>سفارش‌ها</h2><div id="orders"></div></section><section class="panel"><h2>کاربران</h2><div id="users"></div></section></main><script src="app.js"></script></body></html>
